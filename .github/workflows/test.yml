name: Python wheels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install wheel builder
        run: python -m pip install "maturin[zig]==1.15.0"

      - name: Check Rust formatting and lint
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check Python formatting and lint
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: |
          python -m pip install --group lint
          ruff format --check .
          ruff check .

      - name: Build native macOS wheel
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: maturin build --release --locked --interpreter python --out dist

      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        run: maturin build --release --locked --zig --compatibility manylinux_2_28 --interpreter python --out dist

      - name: Install wheel in a clean consumer environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install -r requirements.txt "pytest>=8" "blackjax==1.7.1" "pandas==3.0.6" "polars>=2" "pyhf==0.7.6" "networkx>=3"
          cp -R tests examples docs pyproject.toml CHANGELOG.md "$RUNNER_TEMP/consumer/"

      - name: Check Python types against the installed wheel's dependencies
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        shell: bash
        run: |
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --group lint
          "$RUNNER_TEMP/consumer/bin/pyright" --pythonpath "$RUNNER_TEMP/consumer/bin/python"

      - name: Test installed wheel outside the checkout
        shell: bash
        env:
          JAX_NUM_CPU_DEVICES: "4"
        run: |
          cd "$RUNNER_TEMP/consumer"
          bin/python -m pytest tests -q

      - name: Test documentation examples against the installed wheel
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          "$RUNNER_TEMP/consumer/bin/python" -m pip install -r docs/requirements.txt
          cd "$RUNNER_TEMP/consumer"
          bin/sphinx-build -b doctest -W --keep-going -D plot_gallery=0 docs docs/_build/doctest

      - uses: actions/upload-artifact@v7
        with:
          name: flatppl-python-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/*.whl
            requirements.txt

  docs:
    name: Documentation
    # Autodoc and the example gallery import the wheel that this run built.
    needs: wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/checkout@v7.0.0
        with:
          repository: flatppl/flatppl-examples
          ref: b9ed33856b7fb1969d4ed92e4cd61f872ed5c1fe
          path: flatppl-examples
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: flatppl-python-ubuntu-24.04-py3.14
          path: wheel

      - name: Install the wheel in a clean environment outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/docs"
          (cd wheel && "$RUNNER_TEMP/docs/bin/python" -m pip install -r requirements.txt)
          "$RUNNER_TEMP/docs/bin/python" -m pip install -r docs/requirements.txt
          mkdir "$RUNNER_TEMP/site"
          cp -R docs examples CHANGELOG.md "$RUNNER_TEMP/site/"

      - name: Build the documentation and run the example gallery
        shell: bash
        env:
          FLATPPL_EXAMPLES_DIR: ${{ github.workspace }}/flatppl-examples/examples
        run: |
          cd "$RUNNER_TEMP/site"
          "$RUNNER_TEMP/docs/bin/sphinx-build" -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-artifact@v7
        with:
          name: flatppl-python-docs
          path: ${{ runner.temp }}/site/docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site/docs/_build/html

  deploy-docs:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [docs, wheel]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
