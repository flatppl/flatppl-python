name: Python wheels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install wheel builder
        run: python -m pip install "maturin[zig]==1.15.0"

      - name: Check Rust formatting and lint
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build native macOS wheel
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.5"
        run: maturin build --release --locked --interpreter python --out dist

      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        run: maturin build --release --locked --zig --compatibility manylinux_2_28 --interpreter python --out dist

      - name: Install wheel in a clean consumer environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install -c constraints.txt dist/*.whl "pytest>=8" "blackjax==1.7.1"
          cp -R tests examples docs pyproject.toml "$RUNNER_TEMP/consumer/"

      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP/consumer"
          bin/python -m pytest tests -q

      - name: Test documentation examples against the installed wheel
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          "$RUNNER_TEMP/consumer/bin/python" -m pip install -r docs/requirements.txt
          cd "$RUNNER_TEMP/consumer"
          bin/sphinx-build -b doctest -W --keep-going docs docs/_build/doctest

      - uses: actions/upload-artifact@v7
        with:
          name: flatppl-python-${{ matrix.os }}
          path: |
            dist/*.whl
            constraints.txt

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: flatppl-python-docs
          path: docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy-docs:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [docs, wheel]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
