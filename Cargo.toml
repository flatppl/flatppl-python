[package]
name = "flatppl-python"
description = "Python modules and JAX callables backed by the FlatPPL compiler."
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/flatppl/flatppl-python"

[lib]
name = "flatppl_python"
crate-type = ["rlib", "cdylib"]

[features]
extension = ["dep:pyo3", "dep:flatppl-python-api", "flatppl-python-api/extension"]

[dependencies]
flatppl-python-api = { git = "https://github.com/flatppl/flatppl-rust", rev = "054ef351bd01754a662721f4f338cb0f9562a09e", optional = true }
pyo3 = { version = "0.29", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
