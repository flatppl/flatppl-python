[package]
name = "flatppl-python"
description = "Python modules and JAX callables backed by the FlatPPL compiler."
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/flatppl/flatppl-python"

[lib]
name = "flatppl_python"
crate-type = ["rlib", "cdylib"]

[features]
extension = ["dep:pyo3"]

[dependencies]
flatppl-core = { git = "https://github.com/flatppl/flatppl-rust", rev = "bcc6fd2bac2694a403be17b0c5b74693a86ef8c6" }
flatppl-syntax = { git = "https://github.com/flatppl/flatppl-rust", rev = "bcc6fd2bac2694a403be17b0c5b74693a86ef8c6" }
flatppl-infer = { git = "https://github.com/flatppl/flatppl-rust", rev = "bcc6fd2bac2694a403be17b0c5b74693a86ef8c6" }
flatppl-determinizer = { git = "https://github.com/flatppl/flatppl-rust", rev = "bcc6fd2bac2694a403be17b0c5b74693a86ef8c6" }
flatppl-stablehlo = { git = "https://github.com/flatppl/flatppl-rust", rev = "bcc6fd2bac2694a403be17b0c5b74693a86ef8c6" }
flatppl-fileaccess = { git = "https://github.com/flatppl/flatppl-rust", rev = "bcc6fd2bac2694a403be17b0c5b74693a86ef8c6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
