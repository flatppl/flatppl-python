[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.7 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp312-cp312-macosx_14_0_arm64.whl#sha256=5fd806c7a4322f20c1205b53263de036e4fb38f1bb17ea2fac04a79e30cb8393 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=5ef749d3d88f0fbb9c1fcc816d77da5323ef2e85a8f32e3ce37e6c3cfb3b5e1f ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp313-cp313-macosx_14_0_arm64.whl#sha256=bfc34da81666fc94209a82e2d5f5d3529915ac345fbbf70bf89ff19ab2f1fea5 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=f2770581c1b72cf7e64b59bf23c661fdecc9e1064932a68a8e84b732f52bad0b ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp314-cp314-macosx_14_0_arm64.whl#sha256=40f66a660e0c315ae42f2ee58de58623641f9fe0117e6e2135f6ace418788c1f ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=dabb38d60e19e090371c54c50826d2d7f0e5fa23b627b06fab8c646acae88810 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=6a040d4b876b3ac9cdebc6f74aa48458e7e27b14b5be48201091aceb1138f299 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=e44443771f233d49a42e75638b17338a271705e33a1ddf9eaf072668dc0d8c0a ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.7/enzyme_ad-0.0.15%2Bflatppl.7-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=2b0193df7970f189cd6edd9a6755b58b7ac9d3e8d76276eaace4ab4c73861512 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow, networkx.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.11.2 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.11.2 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
