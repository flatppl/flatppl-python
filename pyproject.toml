[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.10 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp312-cp312-macosx_14_0_arm64.whl#sha256=d84a7470f5b62fd397982b65763a6e8cc374f041a4156fd54cc88eb64b62eade ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=5969d579369fe04773f1a6f59e625340381e7f23b0d8a8d739a1a154efed4563 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp313-cp313-macosx_14_0_arm64.whl#sha256=f564fd943e932de7c9adb834b0f8370cd7b79584dd1fab7e07c4a97e1a5cb79e ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=f41df985de7cbcc7fd52bdf7578c4c368e6a4554b9f90bd56ca1436a00cc3113 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp314-cp314-macosx_14_0_arm64.whl#sha256=0d35f7a2105d26b2098a3297203520d3728522ba431c4e36f7d55322b7a11952 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=03acc86b3718098b571f09ffd38ffee80eae87d30b05c9d4254f6884287b5819 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=a2c28046c12851088b014c9b89a3673a683454679e0d796d0bab2cdbeb33d2dd ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=b685a55ede3b0d9ecc0883ec9111a7e7ed0fe179f454219d12506b520216921c ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.10/enzyme_ad-0.0.15%2Bflatppl.10-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=55bbc9154b2e59a082509be62b99b3ccb80c423bacbf77b9b68e6e0b7975bd04 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro and arviz.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.11.2 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.11.2 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
