[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.9 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp312-cp312-macosx_14_0_arm64.whl#sha256=c3836a490bd9850c3e7286676a8e8c468163e3427c2d40bccabc040f2bec5cb5 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=36559d81954007a9184818215e3caa0e53ba031b8414d9257bc5e8ab3487a149 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp313-cp313-macosx_14_0_arm64.whl#sha256=638ef86704db3cd619ee7c7f54c76c09058d1661fed34fe35c4ee7cd25cfa8ec ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=e4f7dd884df510dca0a20b42447910b8a3e4ab74fcef7449379e178a7fb18629 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp314-cp314-macosx_14_0_arm64.whl#sha256=ff7f6a0db4e642ee89bd1886cdc59303404272756148e5664ba3fc16a066a81b ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=610fe4bcc726ef671106f3cf057286a713f798172b1b826f7212d693e9e8a858 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=2309c72180ac76bcfbda6e19b64f6a7b7311e0713ae1c7deb98faf0e3cd0161c ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=1d1ba95ede51254c563a82eab789a11ac406ea7ff09083d4e5ea36f7761129b1 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.9/enzyme_ad-0.0.15%2Bflatppl.9-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=1dd6d5b6090093e0aa1cb2eb6ac7466f7c259253085b8096ab91142585c297b3 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow, networkx.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.11.2 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.11.2 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
