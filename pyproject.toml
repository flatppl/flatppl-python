[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.3 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp312-cp312-macosx_14_0_arm64.whl#sha256=a49b8b846f6f3f48f28f440fcb524b57537a035ccb7d1cbfab8f0767db97977a ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=6af83cf6bc7b266b3c337daf4dfb3bd20500f2b7b62c5ec581d1583f48933c64 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp313-cp313-macosx_14_0_arm64.whl#sha256=a52348d6c442d0ae905861812dc39c02ec987d2e48a047f6a9a38e520778172c ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=38db79e68d5ed86b18eec5f1ff28d01ff37f417ca1804994ec4f3105f5a8acb8 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp314-cp314-macosx_14_0_arm64.whl#sha256=19aaf28123a749caab855bc7c3276933ad8c45247a9319c2f3a9e178baf5b920 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=bb026e2fc0dd384e2170415110493bb5171fbee6f51a9c1127938a0840329a8c ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=dfff838a42c4ed28bc2c1b82b942bd920e5e950f4a4b5132e96d6fa9a81c010b ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=9db3f8935b6517ca381ce99dc59455f97096f80119520f3b0257e157e47a7eec ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.3/enzyme_ad-0.0.15%2Bflatppl.3-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=22097b3b9aeb4983077b493ad9d2ac1919f4ceafd7fc34984a38108b78157a5f ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "pyhf==0.7.6"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
