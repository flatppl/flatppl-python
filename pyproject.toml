[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.18 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp312-cp312-macosx_14_0_arm64.whl#sha256=d2e926be012af369e8f7adb6209b3320faa3dfd8d91c2f1fdf6b5b1d6e2fdd76 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=977a5a80c5fd423038e283a785b80356bbdca64bd4d0822a4795baba2561c925 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp313-cp313-macosx_14_0_arm64.whl#sha256=2675321c6437ca807e0ede46507d5b13ebf1334019b43f52990d3bd8d10649c8 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=b3f11d761ddfe3cf31493a37f110a93415b591d51860d0408eb15ac3f0a9c7a0 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp314-cp314-macosx_14_0_arm64.whl#sha256=c2da71b86ebc662a0c097a9310a0f90e62e92d3f46cefca6984f7ab971e1e0cc ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=f49ee71a1286293f46b7c88317b776cced79d5cf3e0aa7ecb25292d9d14224fe ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp315-cp315-macosx_14_0_arm64.whl#sha256=f23afca6adc8e452af7adcfd040b712a761fd6adb69a627ca37692c1af7211e0 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=c984447198a6799a2a8b21569c6be7b6c3cfaa62f94014416b381dd6f9ad3af3 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=762e94acf0df0d5e639f28b24105b14456b1cc6c6b59a838cfb1f0dd4014a39f ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=388de053df2c04f5af6820950459bbfe170ec73f33a2879215f6ffe63b208c54 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=2af218a8207ec59cef41b362bf44164f90c2afc23065682516497e42b5b4fff2 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.18/enzyme_ad-0.0.15%2Bflatppl.18-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=92aedcff395c38c06e8fe927ced4408ca5caf6813b42cbab4a88650435dfd312 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
