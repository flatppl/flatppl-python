[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.14 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp312-cp312-macosx_14_0_arm64.whl#sha256=e56853318a8c7364ed310ce7ba80e83e72ab22f2ff6620b565bfb3b8b3183b0e ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=2594162ffe484ff0076b433187fcbb122bd749391588e786d5a8879a22582ece ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp313-cp313-macosx_14_0_arm64.whl#sha256=2cd24a1872982fa2773ab6c9688a3a435ae6446e706c68958651218a8d958e29 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=ddb65a77c9a8474792d9094d69f5c3610b556bcc38ee266bea248dcf20dd4496 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp314-cp314-macosx_14_0_arm64.whl#sha256=3a51729f50850b4b28fc14158b8a20a5efca9a73204bdaf5ea4a1df67dd7b50d ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=3c02d173c31f8fde3dc51fa394a0e944a1c26af05c77771fdf96e5f8a49e2b17 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp315-cp315-macosx_14_0_arm64.whl#sha256=0274a1453d948ae8a0c10e8f5629114dd55a09cf001440c870249ddd5a581ea8 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=00a8126a26477b230ccaf9514ee42080767dcef947d8aec0cad5ef39cb9b7685 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=d9a6d2ab92cf342776066e9d1f80b3470346bde4267e294ffe60513cb4fc671c ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=c4933b63e90b37caa266558bf7691a54ab3f5a07640ffcb40a1ecd629073a6b7 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=a88c2850e246c8d3e39aaf65a96fd4d49fff59a28c7898a671602bbf3c7a9148 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.14/enzyme_ad-0.0.15%2Bflatppl.14-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=cdeaface33543baa4dc51b4bb1591ca644dd04fa4f04e9db20b6d03b5798ef2a ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
