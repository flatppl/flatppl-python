[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.20 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp312-cp312-macosx_14_0_arm64.whl#sha256=5ba6d28603b069f3e11a0ad673511f7f410dc0510ddd55d521bf93944dda500a ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=bb5a249b0a24fa9287d9903f3ef9890b63bb1d26b96d79719312c0c53665b86b ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp313-cp313-macosx_14_0_arm64.whl#sha256=a6091e176e469053410f3bfc5f0e1c9da06746e1208f16c5bf95d4778867741a ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=171627a64d3b0214920c3de8bb6089aa9c57f5f49608dff88c4b1e127e82c343 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp314-cp314-macosx_14_0_arm64.whl#sha256=a03fdb9fa44bf4ff3a974c3f97a92fe644cdd6f56bc303b91cb0fdc38c3aae26 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=b71b6a486ea1c7a27ab17ec2f513eeb655e110a02a29eecb70931368c0475547 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp315-cp315-macosx_14_0_arm64.whl#sha256=32c4cb64cb35d0b46ce6ddc087115cb277f1585ce292321d1fbfc13d9d8aeb88 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=db95c4eada476daeac40c89da23bb9ccf3a8f2a8591ae487cdffe68bd5bad578 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=c99d22d14c72e2c949ded88bcec5ce3b94f3da3708078f2d58d03d90ca4451d5 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=6e61938bba01b9b9f8e66130302a62a77d876b3a7ea95dbd4b62681371fa4bd1 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=e2fe6549f8a370749529ab918999733117bf62c4bf9776917fcdc12d2da41256 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.20/enzyme_ad-0.0.15%2Bflatppl.20-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=48d0d78f1880269bcdd97746c6704e7363c9a40eeed943cc3f944c668ae565c3 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
