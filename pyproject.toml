[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.16 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp312-cp312-macosx_14_0_arm64.whl#sha256=191e9b58c7d2231bc90baf13f35017745419b8ebdb00fab1e66e8f48c2d636b4 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=7a0af923e0fb9052cb52084b3ab86c4967273a10fc4daa27fc5c8add39f6b01b ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp313-cp313-macosx_14_0_arm64.whl#sha256=fe075e8434115150c691b95df1b96737218c73702d0b162b535098105a43154b ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=3f9dc5866c2508fd0bbc9f6391a4204f3b9522a0a0763862ba204ebff0634034 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp314-cp314-macosx_14_0_arm64.whl#sha256=ff1d6933b2c332d1c6b10e11b3ac44a61c1151ef8dac7c83a2c1330ce0ed0192 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=2c8b14bd919d1562cd1b045c237eb04cb88b498a99501a957fb0aacf34b4fe7e ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp315-cp315-macosx_14_0_arm64.whl#sha256=0786ac13c5c10428555e0b6120b5fc7c04ff35ff56b29cd5f699513ee323baf5 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=d5d483473189c84bb72189f592d509bcc9a6a97e5deba118bc51c4a31cdc853f ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=d83eee17862572baab7189ab34e9d795ce44371375b1e85616b768198389b43f ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=248af50bd040f0f0c2a927dc54fa76a07a4fc77a3acd7af68b5c5e7aa7cd7e2b ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=e30ea2b4e49dbde7ce7860e682f077d4c9b3f3e34fc494452f89a8a62448ddc9 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.16/enzyme_ad-0.0.15%2Bflatppl.16-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=abe4df53c65f9e63d4f2778bddc23f6140fcdd4a38593d782afaee204c8a8d29 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
