[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.19 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp312-cp312-macosx_14_0_arm64.whl#sha256=e9270825a6d5fcfadecb69d14aaaa4dcda2ca4c62ff1852abdd701496b729815 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=519e4ab983ba7c6fd81c79d908a22741def98e2ce8bb5975d84f8dec5610e668 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp313-cp313-macosx_14_0_arm64.whl#sha256=e47db89d246254fbf2ed8b94ae2b3dfd05f220b81f52cd2998039d4e5b7b5663 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=87e5eb8b50d6cae0d3089e543207eb1e4b34ea0d1ae1d7fa6ca01fa3fb85ef32 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp314-cp314-macosx_14_0_arm64.whl#sha256=24b0d26c3f7cc3abbb3a79ec627c7b013309adc3ded6712f3d9008ec27e8ec05 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=ff64e9329ec0ee33d14b18c3305a986fb0f16d51990b8c09c356d370f6836cdc ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp315-cp315-macosx_14_0_arm64.whl#sha256=787f04c6e87480199f9c9856e6c21b35ca2b301360cf143fa515224587a6826f ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=af4329cc2aea223c51675ebab9cb2aa48d4619f8d38a10726f3eaa2b031b1943 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=778b6aa6e57df4f5554c4d65a2d89fc1b48c7430d7a354fdde93f05b37435542 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=8a158d95197c10745924c3bda2b01d2538aad6c4f54cbf5dac3017e59cd1cc1c ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=02bddfb20eb03b33887beda90e564cdc9e1bf241e24023fe9dd6ffe2300f51bf ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.19/enzyme_ad-0.0.15%2Bflatppl.19-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=37858dc1178ca80882f5003ae91a38a8c1ae73230388c0416330bc58630ad88b ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
