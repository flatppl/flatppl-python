[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.17 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp312-cp312-macosx_14_0_arm64.whl#sha256=6df8749484f2bc6816a286fa0be9b5825f0f6116f39e9f16703aa826353d638f ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=55f84602a0e301ce324149f0c23ee9a7a954c211238ef3151f96c89f881d0a09 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp313-cp313-macosx_14_0_arm64.whl#sha256=fee490bcbfbf40c11194c439a6517d45bf4232ac47852d28603007067a281a0d ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=37e31102b72bcb69e870494c865fde2e7c6d0a90d0784ac3746307daa2e6abcf ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp314-cp314-macosx_14_0_arm64.whl#sha256=7fcdf35913a24e5f628dead3a6a5bb168c82ff859ce35d359a6d8e725bffce2c ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=4e9d11e47334b1f7c1f112b8bf3aa3549bce61d9d46bc773a2775c70e55c3f47 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp315-cp315-macosx_14_0_arm64.whl#sha256=4e033ed0377cf0db582bbbe57d160aadb23ed498a567480af8a93313ae43b913 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=eea7c3e5e6a849cbebbf6794a66297f03c79efe5131ab5110d14b3e9459ac0ba ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=fcf82a8641d989b0ed65e17fd7fa971e2ba09d8558396515890ca0f1f52417c5 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=2a766882f9d9f729bea3d586d1eeab903bc5257cb3567a4244e7ee288f4410c3 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=886bd46d718f275ec1232181dd001d2e7d5fd6776d6a6087b13d652613193e3c ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.17/enzyme_ad-0.0.15%2Bflatppl.17-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=c7e955e2a2d762d9553d3a782020d2f04ae24517f9b95f1403ad19c997be901b ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
