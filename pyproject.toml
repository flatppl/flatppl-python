[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.5 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp312-cp312-macosx_14_0_arm64.whl#sha256=a7ca3808ff3b24b067fb9a4a641689bcda2cae7a8d503204f9cdbec4de705be7 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=c72ae46896d22ca628ed47d3831467d32229d4d25bf98ca62d83014e1000eee0 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp313-cp313-macosx_14_0_arm64.whl#sha256=ba27be7cb801bab0960519c95769d0149ddd296b1e7961c29b30d62eeca547d6 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=69f379ff59862e73889299f423ec17d82fd609a1cd061cb999abd64066b947a3 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp314-cp314-macosx_14_0_arm64.whl#sha256=c1de748f251188e11f3c9acb292179366a7e62c773b640607bfef79c25a3843e ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=0a74fc0af5fe02b7895a45899a0ff6abf17307b0dcbd8f4e54771950508f7b43 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=b9fb76d9da37023f6b8eedb63dd8a56170f809cd37a693c3a562fb523b57c129 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=1b0474b4761f6d377f87cb3c7e6d9fb8a9cb26026b76d8e28505c05db821d86c ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.5/enzyme_ad-0.0.15%2Bflatppl.5-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=11d36c90e4e58debc922e067ca593ffb754a6f1e31c759ef3228c8390b0ab0b2 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "polars>=2", "pyhf==0.7.6"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
