[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.4 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp312-cp312-macosx_14_0_arm64.whl#sha256=9846dd7e8e28a79bfefb4c2e8b9e2eef76dea407bd26ee93925705f595bb23a1 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=3558f5f7a41ca1667c04099eae117078087f9bcac6d77f6b3ef1a3381adbd021 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp313-cp313-macosx_14_0_arm64.whl#sha256=5c3e2e5133e7c4aae3ed05d2429263402387c05675f6c564c63aa9c4d2616bf2 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=ede1a0ac7c03c0af76bdfd8fcce2132c8fed3ec62fab6bee21f67578e093407c ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp314-cp314-macosx_14_0_arm64.whl#sha256=6e8185e8ee863c19702df4a5f4974acb364613ff60631fb3377b4d281337205a ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=20a0e2df32c271fc0c3ece7de99197f8cf1a633e84c6ec1a46263b647d241707 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=b7d701e28202a60def46d002430a7781dc9e1c865f439c723bb870c02877f1a2 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=b08ee53b85a27bc033e8fc5497aac66116528ba2555e2bffa463a115fe42923f ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.4/enzyme_ad-0.0.15%2Bflatppl.4-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=b4371430f32db70fa868faa061a5f4e3615c6fdea2c58729f02b80d34045e477 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "pyhf==0.7.6"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
