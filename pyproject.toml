[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.13 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp312-cp312-macosx_14_0_arm64.whl#sha256=db6bae9ca57cf9668fc73c41bd90afc81912e8066a1bab7014c8fdf0bd4750cb ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=78b737445fa5e8d31297de35aae7f272d6a237daae5b7452f4d8d2510f2c9bb2 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp313-cp313-macosx_14_0_arm64.whl#sha256=7fca12d11e186251cf283df2b0d5b37f0a7e72ae45393cb3bb5d55076159b9a0 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=6d9826b6427561970b37f6b55ea732421860d3d080db38b9a7705033fc3315c7 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp314-cp314-macosx_14_0_arm64.whl#sha256=0cf74b2d9aa45ccad260c55d9b51cdee49a38dceefb07c80fd78aa01cc11d837 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=4f20a3e2ad7aafb232d8c8b6dc6c06a6e5616e7c701e94d126a955ea817b7776 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp315-cp315-macosx_14_0_arm64.whl#sha256=005e80f52bbcde3dbe063c00f1b95d8f1f7a559bfaf8822a78a192b5595c68ec ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp315-cp315-manylinux_2_35_x86_64.whl#sha256=4fdd2fadcacf11157cb48d5b17b001b7af8161b4b6da1a0d1b7034dd39a93d85 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=a760e6b0141bbcb194062ab9c2fe51b0f5a834660f72f765a1da5ae9f8db4140 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=97e055dbc5ff2543aa38baca2b0bea96288664853646202d521d21b360ea17a3 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=1110961d0bf37268ae45d75b9d93ce2d5ebdce43a6aecdd39bdddb0aa8a241f8 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=62940fb70a9346214b153cc7942f07c8854df43099fb05d42a50be29266ce9b0 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
