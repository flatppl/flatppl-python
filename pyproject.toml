[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.22 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp312-cp312-macosx_14_0_arm64.whl#sha256=63da3195ae26c92f83e9a181e9d62c2831a06f0f0c78f6cb1e0c505f4d63c260 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=7fe43b54f4f2d0efbc28e0514d2bd55a3a3db6ab78e511b61fe9ccae4147f954 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp313-cp313-macosx_14_0_arm64.whl#sha256=362e53e347a383b6260df6fdf283c602352b58000887ae9eb7b5579ce1683cd2 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=d1e9a0c21a3468dfeef970cc9d8c1c9cfa1ea1150b635c5616d9dff506739a3b ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp314-cp314-macosx_14_0_arm64.whl#sha256=70e7b113dd551045ee356d0179958b74f2d1318c44849bbcc44064e1c038d30d ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=50ac50cd4d009c2ebb8bc79daf2147dcc6eac9b910d568b1bd11efaf7ab3d972 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp315-cp315-macosx_14_0_arm64.whl#sha256=7ca0fc5e5e740557b83ced92370b689e9183a4157a58a9de359c7058d6be6742 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=0f2c1bc2dc6f5e9b5dc73d2c778fbc17016b44c7b8dc51e22eb1a644aaedec58 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=3d3ce249c9c09cd79c68be36ea90769111fd7d8ca42d35ca5c68986a1e1fa3e8 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=1d382b98203218c51ce2c11027d781a4ab0c66ebaf11634bbb315ea7430a3acb ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=65a24411d1591e3c9ad102e95523f4b1d54147a1d0575f8582bfc63adfb92e74 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.22/enzyme_ad-0.0.15%2Bflatppl.22-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=c2db3a7c5097d1ad11ad0e863d750aeaea2742af8ef84a8be99149a9e9d922e3 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
