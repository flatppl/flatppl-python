[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.21 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp312-cp312-macosx_14_0_arm64.whl#sha256=f6e3aa7ad008a1b34c8e163ea3a309d8cea092e3ace9c01bb8d8dedc0014def5 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=ccab2fe85ba2f292cbe2258c648c4f84ea0dac440de6e27a98cbca2e51f4bfd4 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp313-cp313-macosx_14_0_arm64.whl#sha256=00402741416deabe6aa3a6072e5b78e470914b16fd6419950e665bcfd9012ede ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=809ad16306aaac88f17310d545efcf56072b380eb51d383cf7d4e09d88a5ccab ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp314-cp314-macosx_14_0_arm64.whl#sha256=d890050d1a4f39a09060d3159128c06d5a208ddcd76ae131736aa9ba46b5e3fb ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=0559a3e68c82dbebf851f3e486d6ed6304a1a50f25196377f70df29a85a6dca0 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp315-cp315-macosx_14_0_arm64.whl#sha256=c289c882ad82bb2bb1fb3cf78761859b0b51a6ba5898f09ab83ca38411e42f62 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=30a26638639c503ac47fe73a557ab245a931ee870e206a495d038c17184551fb ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=7002147927d1f899ddcf384a7796dbb607ed5403a84386bba2a6d9535ce9c40d ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=fee06db20a58dc2d662304ec7c6c9960f107f256d0e1ca077b0918bdf39a20fe ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=60decbd60ce961b1812cc4ac933b171ae0aa38798eafafbb0b94c182d5cde822 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.21/enzyme_ad-0.0.15%2Bflatppl.21-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=f4f81e7259585350cec967dc764d2132136721469a563e5da228c8656aa49f9c ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
