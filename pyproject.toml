[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.11 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp312-cp312-macosx_14_0_arm64.whl#sha256=32c84ad193ac92470dac5b19c2a70e1b1db081e23802645feb5237b0da8ce520 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=f5b028cc409633b8cfca9df2a95792f443199b90a177d32d68df437459c96d99 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp313-cp313-macosx_14_0_arm64.whl#sha256=ee49eb9dde3926e248a032609da12b3c340cbfd744f58e17c15ff74bdef9b0fa ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=2b5b408b4e57a39be3fae19d865f09c72df5eecaf22bc003f82c839e10644b42 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp314-cp314-macosx_14_0_arm64.whl#sha256=361c75221be2536afbf25ea99ceb8825590ce27b3ecaee64cf3684e49a2531a6 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=65774e06b518e3fd1f435dd01a612bfbc1776ebcc113208ea31373f117587af1 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=eb37b49e7f619f9214236bdb44e491b8ea1fd556cbf516500915820e7d9582c4 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=9da36828d5994689c642849416d0c6a68bdacd56dab23298d4bbfe21203bd635 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.11/enzyme_ad-0.0.15%2Bflatppl.11-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=eba2e74cbfb20131b88b377f9d344fb21773ebe1f12ced6afd987122c47589ad ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro and arviz.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.11.2 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.11.2 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
