[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.8 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp312-cp312-macosx_14_0_arm64.whl#sha256=9e7f10328d655441ec99855df4f5e8954f5da60ff689ec91f16acfb13aeb589c ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=1f9c9dedf8e59d9883ae5d40f481783acc50855386e53f1ac50a9957b11737ed ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp313-cp313-macosx_14_0_arm64.whl#sha256=a3ad7c447a4aa897468e3ef3126406d21f73919e51d52d8349e6df27df01821a ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=576ed5eb7034c1dcbd51e882f6a7bd64900a3d3b50fe2f9745bf1f81fe3355af ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp314-cp314-macosx_14_0_arm64.whl#sha256=8896a2b1fc5bd8ceb3da79c94502edc3ba5bdaea4ee4848d93b026a7c95764fb ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=397cc2f151fba22749415c663cdea9a2fa9668e9956bc96fa541505a632ada62 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=c418797a8bf93407b0c9b24515ea31f78538b3a9546d413d638e188c53341772 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=762548fb7ac2d502e6a9293c24d579cd633fea90adbffd509e0bae9fcfcafac4 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.8/enzyme_ad-0.0.15%2Bflatppl.8-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=f4ef21f8ba371735cb14fffcb49c76221b7b09f2bf243db2210a2ac506b88368 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow, networkx.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.11.2 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.11.2 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
