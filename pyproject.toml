[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jax==0.11.2",
    "jaxlib==0.11.2",
    "numpy>=2",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.2 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or platform_machine != "x86_64")',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.2/enzyme_ad-0.0.15%2Bflatppl.2-cp312-cp312-macosx_14_0_arm64.whl#sha256=176ed08d126fd09d2fc161b81f5cde37fd96716941bd9da0b2c80d28175dea60 ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.2/enzyme_ad-0.0.15%2Bflatppl.2-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=9edc8c77aef18107010ff02d0108bcf144d802cfbe7bf4ee7bfb1f81dd51ef72 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.2/enzyme_ad-0.0.15%2Bflatppl.2-cp313-cp313-macosx_14_0_arm64.whl#sha256=faf3bcd25da241b0ad8fa4a06d6f2ea31af1b0da82f52539aca1859e2d485c7c ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.2/enzyme_ad-0.0.15%2Bflatppl.2-cp313-cp313-manylinux_2_35_x86_64.whl#sha256=52ef9a24eb3632b7c4472e26a97647b5c9f15cd4a54b8f85def0dc5d8821703a ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.2/enzyme_ad-0.0.15%2Bflatppl.2-cp314-cp314-macosx_14_0_arm64.whl#sha256=e4d9d06bda822cc2a9c77fdd48f4c0a21f7ee672cb85fde5d7ebc817c1fb8553 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.2/enzyme_ad-0.0.15%2Bflatppl.2-cp314-cp314-manylinux_2_35_x86_64.whl#sha256=733a956ff334aa0c28300301453c728eaa47675d0c742bc9d6f963a2c2446b13 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.0.6"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
