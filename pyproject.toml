[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.23 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp312-cp312-macosx_14_0_arm64.whl#sha256=5878a1b64f203a32a0f00fcd3b0014835592617b240dd1a9398a7a3d432435ef ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=5d4c107037e2d464eaa8c77cb7bbf56a9dde36aa5be7f1452e2db8b9f3cab6a4 ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp313-cp313-macosx_14_0_arm64.whl#sha256=769b0d56dbfc0e40f7be54101ce16fc36c68d2ce13426eff77e4bfce08271da6 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=bce146e4f678658268fceae44bb434a7db61323f7a2c649adfe2672d9a2bf63b ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp314-cp314-macosx_14_0_arm64.whl#sha256=6e5ea628274b867d8e1afa1639fc9e135fa72eda7bff6c597b81a98ef044cf3f ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=98ffc48ca3bb66841e165ce53ceb1529d2304e95b21fdae52f158e94502cfccb ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp315-cp315-macosx_14_0_arm64.whl#sha256=d4f2ed31b284227c56b197e6b79b39c2ed76d11201d33f0290081e260c72ddf4 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=5de8cc121541b79d5a7ed3a49f2cce7ff79e18b23fdc7d1f10283c5f5d31e691 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=c7b7e80484bddd2f996abdb4d50986a76d80f8ffe05a3030bc53bdb71cb1145d ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=d6927bdcf5255e4d08a0a02ae050ef63559519ef97a754c9e8f3e90a6bce4e08 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=008d1c4fb441b64f5439e73dff5601ee2fb5e9e7dd10c86bb09dac2aa06f1eb2 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.23/enzyme_ad-0.0.15%2Bflatppl.23-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=1fc380bc857945e226e5f1cd22fa9832771501e73241ffde03741d6e3533476e ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
